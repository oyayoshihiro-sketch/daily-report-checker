<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日報チェッカー</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sw: 228px;
  /* Green primary */
  --c-pri:    #16a34a;
  --c-pri-h:  #15803d;
  --c-pri-lt: #f0fdf4;
  --c-pri-s:  #dcfce7;
  --c-pri-m:  #bbf7d0;
  /* Sidebar */
  --c-sb:     #0b1a0e;
  --c-sb2:    #162b1a;
  --c-sb3:    #1e3d24;
  --c-sbT:    #86efac;
  --c-sbT2:   #4ade80;
  /* Layout */
  --c-bg:     #f0fdf4;
  --c-sur:    #ffffff;
  --c-bdr:    #e5e7eb;
  --c-bdr2:   #d1fae5;
  /* Text */
  --c-t1:     #111827;
  --c-t2:     #374151;
  --c-t3:     #6b7280;
  --c-t4:     #9ca3af;
  /* Status */
  --c-red:    #ef4444; --c-redB:  #fef2f2; --c-redBr: #fca5a5; --c-redS: #fee2e2;
  --c-amb:    #f59e0b; --c-ambB:  #fffbeb; --c-ambBr: #fcd34d; --c-ambS: #fef3c7;
  --c-grn:    #22c55e; --c-grnB:  #f0fdf4; --c-grnBr: #86efac;
  --c-blu:    #3b82f6; --c-bluB:  #eff6ff;
  /* Shadows */
  --sh0: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --sh1: 0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
  --sh-g: 0 4px 20px rgba(22,163,74,.18);
  --r: 12px; --r2: 8px; --r3: 6px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  font-size: 14px; line-height: 1.5; color: var(--c-t1);
}

/* ── Layout ── */
.layout { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sb {
  width: var(--sw);
  background: linear-gradient(180deg, var(--c-sb) 0%, #0d1f11 100%);
  display: flex; flex-direction: column; flex-shrink: 0;
  position: relative;
}
.sb::after {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(34,197,94,.15), transparent);
}

.sb-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 18px 18px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.sb-logo-ico {
  font-size: 22px;
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(34,197,94,.4);
}
.sb-logo-wrap {}
.sb-logo-txt { color: #fff; font-weight: 800; font-size: 14px; letter-spacing: -.02em; }
.sb-logo-sub { color: var(--c-sbT); font-size: 10px; opacity: .7; }

.sb-nav { padding: 12px 8px; flex: 1; }
.nv {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  margin-bottom: 2px; color: var(--c-sbT); font-size: 13px; font-weight: 500;
  cursor: pointer; user-select: none;
  transition: background .12s, color .12s;
}
.nv:hover  { background: var(--c-sb2); color: #d1fae5; }
.nv.active {
  background: linear-gradient(135deg, rgba(34,197,94,.2), rgba(22,163,74,.15));
  color: #fff;
  border: 1px solid rgba(34,197,94,.25);
}
.nv-ico { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nv-badge {
  margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: var(--c-red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 100px;
}

.sb-foot {
  padding: 14px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.sb-user-card {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
}
.sb-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #22c55e, #0d9488);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name { color: #e2e8f0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-cron { color: var(--c-sbT); font-size: 10.5px; margin-top: 1px; opacity: .7; }
.sb-logout {
  color: var(--c-sbT); font-size: 13px; text-decoration: none; flex-shrink: 0;
  transition: color .12s; line-height: 1;
}
.sb-logout:hover { color: #fff; }

/* ── Main ── */
.main { flex: 1; overflow-y: auto; background: var(--c-bg); }
.page { padding: 28px; max-width: 1200px; }

/* ── Topbar ── */
.topbar {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; gap: 14px;
}
.tb-left { min-width: 0; }
.tb-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; letter-spacing: -.02em; color: var(--c-t1); }
.tb-sub   { font-size: 12.5px; color: var(--c-t3); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.tb-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-grn); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.4); }
  50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
}

/* ── View tabs ── */
.view-tabs {
  display: inline-flex; gap: 2px;
  background: rgba(0,0,0,.04); border-radius: 10px; padding: 3px;
}
.vtab {
  padding: 5px 16px; font-size: 13px; font-weight: 600; border-radius: 7px;
  cursor: pointer; color: var(--c-t3); transition: background .12s, color .12s;
}
.vtab.active { background: #fff; color: var(--c-pri); box-shadow: var(--sh0); }

/* ── Buttons ── */
.btn {
  padding: 8px 16px; border-radius: var(--r2); font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; transition: opacity .15s, transform .1s;
  white-space: nowrap; font-family: inherit;
}
.btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-pri {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff; box-shadow: var(--sh-g);
}
.btn-sec {
  background: var(--c-sur); color: var(--c-t2);
  border: 1.5px solid var(--c-bdr);
  box-shadow: var(--sh0);
}
.btn-sm  { padding: 5px 11px; font-size: 12px; }

/* ── Inputs ── */
.inp {
  padding: 7px 12px; border: 1.5px solid var(--c-bdr2);
  border-radius: var(--r2); font-size: 13px; color: var(--c-t1);
  background: #fafffe; outline: none; transition: border-color .15s, box-shadow .15s;
  font-family: inherit;
}
.inp:focus { border-color: var(--c-grn); box-shadow: 0 0 0 3px rgba(34,197,94,.12); }
select.inp { cursor: pointer; }

/* ── Stats bar (compact) ── */
.stats { display:flex; align-items:center; flex-wrap:wrap; background:var(--c-sur); border:1.5px solid var(--c-bdr); border-radius:var(--r); padding:8px 4px; margin-bottom:14px; box-shadow:var(--sh0); }
.sc { display:flex; align-items:center; gap:6px; padding:5px 16px; border-right:1px solid var(--c-bdr2); }
.sc:last-child { border-right:none; }
.sc-ico { font-size:15px; line-height:1; }
.sc-val { font-size:18px; font-weight:800; color:var(--c-t1); line-height:1; }
.sc.s-g .sc-val { color: var(--c-pri); }
.sc.s-a .sc-val { color: var(--c-amb); }
.sc.s-r .sc-val { color: var(--c-red); }
.sc-lbl { font-size:11px; color:var(--c-t3); font-weight:600; }

/* ── Section ── */
.sec { margin-bottom: 28px; }
.sec-ttl { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--c-t1); letter-spacing: -.01em; }
.cnt-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--c-red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 100px; padding: 2px 7px; min-width: 22px; }

/* ── Alert cards ── */
.ac {
  background: var(--c-sur); border: 1.5px solid var(--c-redBr);
  border-left: 4px solid var(--c-red);
  border-radius: var(--r); padding: 16px 20px; margin-bottom: 10px; box-shadow: var(--sh0);
}
.ac.warn { border-color: var(--c-ambBr); border-left-color: var(--c-amb); }
.ac-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ac-who { display: flex; align-items: center; gap: 10px; }
.ac-name { font-size: 15px; font-weight: 800; }
.ac-grp  { font-size: 12px; color: var(--c-t3); margin-top: 2px; }
.ac-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ac-dets { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.det-box {
  background: var(--c-bg); border: 1.5px solid var(--c-bdr2);
  border-radius: var(--r2); padding: 10px 14px; flex: 1; min-width: 110px;
}
.det-lbl { font-size: 10.5px; color: var(--c-t4); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; font-weight: 700; }
.det-val { font-size: 16px; font-weight: 800; }

/* ── Chips ── */
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.c-r { background: var(--c-redS);  color: var(--c-red); }
.c-a { background: var(--c-ambS);  color: #92400e; }
.c-g { background: var(--c-pri-s); color: var(--c-pri); }
.c-b { background: var(--c-bluB);  color: var(--c-blu); }
.c-x { background: #f1f5f9; color: var(--c-t3); border: 1px solid var(--c-bdr); }
.c-p { background: #f5f3ff; color: #7c3aed; }

/* ── Dot ── */
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.d-g { background: var(--c-grn); box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
.d-a { background: var(--c-amb); box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
.d-r { background: var(--c-red); box-shadow: 0 0 0 3px rgba(239,68,68,.2); }
.d-n { background: transparent; border: 2px solid var(--c-t4); }

/* ── Monitor toggle ── */
.mon-btn {
  padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700;
  border: 1.5px solid; cursor: pointer; transition: all .12s; background: none;
  font-family: inherit; white-space: nowrap;
}
.mon-on  { background: var(--c-pri-s); color: var(--c-pri); border-color: var(--c-pri-m); }
.mon-off { background: #f1f5f9; color: var(--c-t3); border-color: var(--c-bdr); }

/* ── Dept block ── */
.db {
  background: var(--c-sur); border: 1.5px solid var(--c-bdr);
  border-radius: var(--r); margin-bottom: 14px; overflow: hidden; box-shadow: var(--sh0);
}
.db-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; background: #fafffe; border-bottom: 1.5px solid var(--c-bdr2);
}
.db-hd-name { font-weight: 800; font-size: 13.5px; color: var(--c-t1); }
.db-hd-stat { font-size: 12px; color: var(--c-t3); }
.tm-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 18px 7px 30px; background: #f7fef9; border-bottom: 1px solid var(--c-bdr2);
}
.tm-hd-name { font-weight: 700; font-size: 12.5px; color: var(--c-pri); }
.tm-hd-stat { font-size: 11.5px; color: var(--c-t4); }

/* ── Member rows ── */
.mr {
  display: grid; grid-template-columns: 20px 1fr 100px 88px 180px 78px 68px;
  align-items: start; gap: 10px; padding: 11px 18px;
  border-bottom: 1px solid #f3faf5; transition: background .1s;
}
.mr:last-child { border-bottom: none; }
.mr:hover { background: #fafff9; }
.mr.rf { background: #fffdf0; }
.mr.rf:hover { background: #fef9e0; }
.mr.rc { background: #fff5f5; }
.mr.rc:hover { background: #fef2f2; }
.mr.rm { background: #fff8f8; border-left: 3px solid var(--c-red); }
.mr.rm:hover { background: #fff2f2; }

/* Signal pill */
.sig-pill { display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700; }
.sig-r { background:var(--c-redS); color:var(--c-red); }
.sig-y { background:var(--c-ambS); color:#92400e; }
.sig-g { background:var(--c-pri-s); color:var(--c-pri); }

/* Summary text */
.mr-summary { font-size:11px;color:var(--c-t3);margin-top:2px;font-style:italic; }
.ac-summary { font-size:12.5px;color:var(--c-t2);font-style:italic;background:var(--c-bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;border-left:3px solid var(--c-pri-m); }

/* Missing grid */
.missing-grid { display:flex;flex-wrap:wrap;gap:8px; }
.missing-card { background:#fff5f5;border:1.5px solid var(--c-redBr);border-radius:10px;padding:10px 16px;min-width:110px; }
.missing-card-name { font-weight:700;font-size:13px;color:var(--c-t1); }
.missing-card-grp  { font-size:11px;color:var(--c-t3);margin-top:2px; }
.th-row {
  display: grid; grid-template-columns: 20px 1fr 100px 88px 180px 78px 68px;
  align-items: center; gap: 10px; padding: 8px 18px;
  background: #f0fdf4; border-bottom: 1.5px solid var(--c-bdr2);
}
.th { font-size: 10.5px; font-weight: 800; color: var(--c-pri); text-transform: uppercase; letter-spacing: .07em; }
.th-r { text-align: right; }
.mr-name  { font-weight: 700; font-size: 13.5px; }
.mr-meta  { font-size: 11px; color: var(--c-t4); margin-top: 1px; }
.mr-time  { font-size: 13px; font-variant-numeric: tabular-nums; }
.mr-sent  { font-size: 13px; }
.mr-vol   { font-size: 13px; font-variant-numeric: tabular-nums; }
.mr-flags { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

/* ── Weekly grid ── */
.wk-nav { display: flex; align-items: center; gap: 10px; }
.wk-range { font-weight: 800; font-size: 15px; min-width: 220px; text-align: center; color: var(--c-t1); }
.wk-arr {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; background: var(--c-sur); border: 1.5px solid var(--c-bdr);
  cursor: pointer; font-size: 16px; line-height: 1; transition: background .12s, border-color .12s;
  user-select: none; box-shadow: var(--sh0);
}
.wk-arr:hover { background: var(--c-pri-lt); border-color: var(--c-pri-m); }
.wk-stats {
  display: flex; gap: 28px; background: var(--c-sur); border: 1.5px solid var(--c-bdr2);
  border-radius: var(--r); padding: 16px 24px; margin-bottom: 18px; box-shadow: var(--sh0);
}
.ws-item { display: flex; align-items: baseline; gap: 6px; }
.ws-val { font-size: 26px; font-weight: 900; color: var(--c-t1); letter-spacing: -.03em; }
.ws-lbl { font-size: 12px; color: var(--c-t3); }
.wk-wrap { overflow-x: auto; }
.wk-block {
  min-width: 760px; background: var(--c-sur); border: 1.5px solid var(--c-bdr);
  border-radius: var(--r); overflow: hidden; box-shadow: var(--sh0); margin-bottom: 14px;
}
.wk-dept-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; background: #fafffe; border-bottom: 1.5px solid var(--c-bdr2);
}
.wk-dept-nm { font-weight: 800; font-size: 13.5px; color: var(--c-t1); }
.wk-tm-hd { padding: 7px 16px 7px 26px; background: #f7fef9; border-bottom: 1px solid var(--c-bdr2); font-weight: 700; font-size: 12.5px; color: var(--c-pri); }

/* Week grid row */
.wg-row { display: grid; grid-template-columns: 180px repeat(5, 1fr) 110px 68px; border-bottom: 1px solid #f3faf5; align-items: stretch; }
.wg-row:last-child { border-bottom: none; }
.wg-row:hover .wg-name { background: #fafff9; }
.wg-hd-row { display: grid; grid-template-columns: 180px repeat(5, 1fr) 110px 68px; border-bottom: 2px solid var(--c-bdr2); background: #f0fdf4; }
.wg-hd-cell { padding: 8px 4px; text-align: center; font-size: 11.5px; font-weight: 800; color: var(--c-pri); border-left: 1px solid var(--c-bdr2); }
.wg-hd-cell:first-child { border-left: none; }
.wg-hd-cell.today { color: #fff; background: var(--c-pri); }
.wg-weekly-cell { border-left: 2px solid var(--c-bdr2); padding: 6px 6px; display: flex; align-items: center; justify-content: center; background: #f7fef9; }
.wg-weekly-hd { border-left: 2px solid var(--c-pri-m) !important; background: #dcfce7 !important; color: var(--c-pri) !important; font-size: 11px !important; }
.wg-name { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; min-width: 0; }
.wg-name-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.wg-cell { border-left: 1px solid var(--c-bdr2); padding: 5px 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.wg-cell:hover .cell-pill { filter: brightness(.96); }
.wg-cell.wkend { background: #fafafa; cursor: default; }
.wg-cell.future { cursor: default; }
.cell-pill { display: flex; flex-direction: column; align-items: center; padding: 4px 6px; border-radius: 8px; min-width: 54px; max-width: 80px; font-size: 11.5px; font-weight: 700; line-height: 1.35; text-align: center; transition: filter .1s; }
.cp-g { background: var(--c-pri-s); color: var(--c-pri); }
.cp-a { background: var(--c-ambS); color: #92400e; }
.cp-r { background: var(--c-redS); color: var(--c-red); }
.cp-none { background: #f1f5f9; color: var(--c-t4); border: 1.5px dashed var(--c-bdr); }
.cp-fut { background: repeating-linear-gradient(45deg,#f8fafc 0,#f8fafc 3px,#f0f7f1 3px,#f0f7f1 6px); min-width: 54px; height: 34px; border-radius: 8px; }
.cp-wk  { opacity: .4; pointer-events: none; }
.cell-time { font-size: 12px; font-weight: 800; }
.cell-flag { font-size: 10px; opacity: .85; margin-top: 1px; }
.wg-toggle { border-left: 1px solid var(--c-bdr2); display: flex; align-items: center; justify-content: center; padding: 6px 4px; }

/* ── Org score card ── */
.org-card { background:var(--c-sur); border:1.5px solid var(--c-bdr); border-radius:var(--r); padding:16px 20px; margin-bottom:16px; box-shadow:var(--sh0); }
.org-card-top { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.org-card-sig { display:flex; align-items:center; gap:8px; }
.org-card-label { font-size:11px; font-weight:700; color:var(--c-t3); text-transform:uppercase; letter-spacing:.05em; }
.org-card-vals { display:flex; align-items:baseline; gap:16px; flex:1; }
.org-score-big { font-size:26px; font-weight:800; }
.org-rate-txt { font-size:14px; font-weight:700; color:var(--c-t2); }
.org-summary-line { font-size:12.5px; color:var(--c-t2); padding-top:10px; border-top:1px solid var(--c-bdr2); font-style:italic; }
/* Group mini-cards */
.org-grp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:16px; }
.org-grp-card { background:var(--c-sur); border:1.5px solid var(--c-bdr); border-radius:10px; padding:12px 14px; box-shadow:var(--sh0); }
.org-grp-child { border-style:dashed; background:#fafff9; }
.org-grp-hd { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.org-grp-name { font-size:12px; font-weight:700; color:var(--c-t1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.org-grp-body { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
.org-grp-score { font-size:22px; font-weight:800; }
.org-grp-rate { font-size:12px; color:var(--c-t3); font-weight:600; }
.org-grp-sig { font-size:11px; color:var(--c-t3); }
/* Weekly org row */
.wg-org-row { display:grid; grid-template-columns:180px repeat(5,1fr) 110px 68px; border-bottom:1px solid var(--c-bdr2); background:#f0fdf4; }
.wg-org-row.grp { background:#fafff9; }
.wg-org-name { display:flex; align-items:center; gap:8px; padding:9px 14px; font-size:11.5px; font-weight:800; color:var(--c-pri); }

/* ── Card ── */
.card {
  background: var(--c-sur); border: 1.5px solid var(--c-bdr);
  border-radius: var(--r); overflow: hidden; box-shadow: var(--sh0); margin-bottom: 16px;
}
.cr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1px solid #f0fdf4; gap: 14px;
}
.cr:last-child { border-bottom: none; }
.cr:hover { background: #fafff9; }
.cr-lbl { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; color: var(--c-t1); }
.cr-desc { font-size: 12px; color: var(--c-t3); }
.cr-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ── Colors ── */
.t-r { color: var(--c-red); }
.t-a { color: var(--c-amb); }
.t-g { color: var(--c-pri); }
.t-3 { color: var(--c-t3); }
.t-b { color: var(--c-blu); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--c-t1); color: #fff;
  padding: 12px 18px; border-radius: var(--r); font-size: 13px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 9999; pointer-events: none;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: none; }
.to-ok  { background: var(--c-pri); }
.to-err { background: var(--c-red); }

/* ── Spinner ── */
.spin-wrap { display: flex; align-items: center; justify-content: center; padding: 80px; }
@keyframes sp { to { transform: rotate(360deg); } }
.spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--c-pri-m); border-top-color: var(--c-pri); animation: sp .7s linear infinite; }

/* ── Empty ── */
.empty { text-align: center; padding: 56px 20px; color: var(--c-t3); }
.empty-ico { font-size: 44px; margin-bottom: 14px; }
.empty-ttl { font-size: 16px; font-weight: 800; color: var(--c-t2); margin-bottom: 6px; }

/* ── 勝ち負けBoard ── */
.wl-hero {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
}
.wl-hero-card {
  flex: 1; min-width: 140px;
  border-radius: var(--r); padding: 16px 20px; text-align: center;
}
.wl-hero-card.wins  { background: #eff6ff; border: 2px solid #93c5fd; }
.wl-hero-card.losses{ background: #faf5ff; border: 2px solid #c4b5fd; }
.wl-hero-card.dual  { background: var(--c-pri-s); border: 2px solid var(--c-pri-m); }
.wl-hero-card.refl  { background: #fff7ed; border: 2px solid #fed7aa; }
.wl-hero-num { font-size: 36px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.wl-hero-lbl { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
.wl-hero-card.wins  .wl-hero-num { color: #1d4ed8; }
.wl-hero-card.losses.wl-hero-num { color: #7c3aed; }
.wl-hero-card.dual  .wl-hero-num { color: var(--c-pri); }
.wl-hero-card.refl  .wl-hero-num { color: #c2410c; }
.wl-hero-card.wins  .wl-hero-lbl { color: #1d4ed8; }
.wl-hero-card.losses .wl-hero-lbl{ color: #7c3aed; }
.wl-hero-card.dual  .wl-hero-lbl { color: var(--c-pri); }
.wl-hero-card.refl  .wl-hero-lbl { color: #c2410c; }
/* メンバーリスト（コンパクト行） */
.wl-grid {
  display: flex; flex-direction: column;
  border: 1.5px solid var(--c-bdr); border-radius: 10px; overflow: hidden;
  margin-bottom: 14px; box-shadow: var(--sh0);
}
.wl-card {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 12px;
  padding: 8px 14px; background: #fff;
  border-bottom: 1px solid var(--c-bdr2);
  transition: background .1s;
}
.wl-card:last-child { border-bottom: none; }
.wl-card:hover { background: #fafffe; }
.wl-card.wl-nopost { opacity: .45; }
.wl-card-name { font-weight: 700; font-size: 13px; color: var(--c-t1); }
.wl-card-meta { font-size: 10.5px; color: var(--c-t3); margin-top: 1px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.wl-row-stats { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
/* 勝ち/負けバッジ */
.wl-verdict { font-size: 12px; font-weight: 800; padding: 3px 11px; border-radius: 20px; white-space: nowrap; }
.wl-verdict.win  { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #93c5fd; }
.wl-verdict.loss { background: #faf5ff; color: #7c3aed; border: 1.5px solid #c4b5fd; }
.wl-verdict.none { background: #f8fafc; color: #94a3b8; border: 1.5px dashed #e2e8f0; font-weight: 600; }
/* 週次カレンダー */
.wl-week-card { grid-template-columns: 1fr !important; align-items: start !important; }
.wl-wcard-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wl-wcard-record { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.wl-wcard-score-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.wl-wcard-score-num { font-size: 18px; font-weight: 900; line-height: 1; }
.wl-wcard-score-lbl { font-size: 10px; font-weight: 700; color: var(--c-t3); }
.wl-week-cal {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 4px; margin-top: 8px;
}
.wl-wc-cell {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; border-radius: 6px;
}
.wl-wc-dow { font-size: 10px; font-weight: 700; color: var(--c-t4); }
.wl-wc-val { font-size: 12px; font-weight: 900; }
.wl-wc-date { font-size: 9px; color: var(--c-t4); }
.wl-wc-cell.win  { background: #dbeafe; }
.wl-wc-cell.win  .wl-wc-val { color: #1d4ed8; }
.wl-wc-cell.win  .wl-wc-dow { color: #3b82f6; }
.wl-wc-cell.loss { background: #ede9fe; }
.wl-wc-cell.loss .wl-wc-val { color: #7c3aed; }
.wl-wc-cell.loss .wl-wc-dow { color: #8b5cf6; }
.wl-wc-cell.none { background: #f8fafc; border: 1px dashed #e2e8f0; }
.wl-wc-cell.none .wl-wc-val { color: #94a3b8; }
.wl-wc-cell.none .wl-wc-dow { color: #cbd5e1; }
.wl-wc-cell.np   { background: #f1f5f9; }
.wl-wc-cell.np   .wl-wc-val { color: #cbd5e1; }
/* 振返バー（ヒーロー/カード共通） */
.wl-refl-bar  { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.wl-refl-track{ flex: 1; height: 5px; background: var(--c-bdr); border-radius: 3px; overflow: hidden; }
.wl-refl-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #f59e0b, #22c55e); }
/* 振返レベル＆成長コメント行 */
.wl-card-note {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
  padding: 5px 14px 6px 24px;
  border-top: 1px dashed var(--c-bdr2);
  font-size: 11.5px; line-height: 1.5;
}
.wl-refl-lbl { font-weight: 700; white-space: nowrap; }
.wl-growth-txt { color: var(--c-t2); }
.wl-dept-ttl {
  font-size: 13px; font-weight: 800; color: var(--c-t1);
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px; margin-bottom: 12px;
  border-bottom: 2px solid var(--c-bdr2);
}
.wl-sub-dept { margin-bottom: 16px; }
.wl-sub-dept-ttl {
  font-size: 12px; font-weight: 700; color: var(--c-t2);
  display: flex; align-items: center; gap: 7px;
  padding: 5px 10px; margin-bottom: 8px;
  background: var(--c-bg2); border-radius: 6px;
  border-left: 3px solid var(--c-bdr2);
}
/* 組織別投稿率グリッド */
.wl-org-rate-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-bottom:20px; }
.wl-org-rate-card { background:var(--c-sur); border:1.5px solid var(--c-bdr); border-radius:10px; padding:11px 13px; box-shadow:var(--sh0); }
.wl-org-rate-card.child { border-style:dashed; background:#fafff9; }
.wl-org-rate-name { font-size:11.5px; font-weight:700; color:var(--c-t1); margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wl-org-rate-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; text-align:center; }
.wl-org-rate-cell { display:flex; flex-direction:column; gap:2px; }
.wl-org-rate-lbl { font-size:9px; font-weight:700; }
.wl-org-rate-pct { font-size:13px; font-weight:800; }
.wl-org-rate-bar { height:3px; border-radius:2px; margin-top:2px; background:var(--c-bdr2); }
.wl-org-rate-fill { height:100%; border-radius:2px; }
.wl-no-post {
  background: #fff5f5; border: 1.5px solid var(--c-redBr); border-radius: 8px;
  padding: 6px 12px; font-size: 11.5px; color: var(--c-red); font-weight: 600;
}
/* 期間タブ */
.wl-period-tabs {
  display: flex; gap: 3px;
  background: rgba(0,0,0,.06); padding: 3px; border-radius: 8px;
}
.wl-period-tab {
  padding: 5px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: background .12s, color .12s; color: var(--c-t3);
  border: none; background: transparent;
}
.wl-period-tab.active {
  background: #fff; color: var(--c-t1);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
/* 週/月ナビゲーション */
.wl-period-nav { display: flex; align-items: center; gap: 6px; }
.wl-period-range {
  font-size: 12px; font-weight: 700; color: var(--c-t2);
  min-width: 154px; text-align: center;
}
.wl-nav-btn {
  width: 28px; height: 28px; border: 1.5px solid var(--c-bdr);
  border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--c-t2); line-height: 1;
}
.wl-nav-btn:hover { background: var(--c-bg); }
/* 週次タイムライン */
.wl-week-day {
  display: grid; grid-template-columns: 44px 10px 1fr;
  gap: 8px; align-items: start;
  padding: 7px 14px; border-top: 1px solid var(--c-bdr2);
}
.wl-week-day:first-child { border-top: none; }
.wl-day-lbl { font-size: 10.5px; font-weight: 700; color: var(--c-t3); padding-top: 1px; }
.wl-day-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; flex-shrink: 0;
  background: var(--c-bdr);
}
.wl-day-dot.red    { background: var(--c-red); }
.wl-day-dot.yellow { background: var(--c-amb); }
.wl-day-dot.green  { background: var(--c-grn); }
.wl-day-content { min-width: 0; font-size: 11.5px; line-height: 1.5; }
.wl-day-w { color: #1d4ed8; }
.wl-day-l { color: #7c3aed; margin-top: 2px; }
.wl-day-none { color: var(--c-t4); font-style: italic; }
/* 投稿統計バー */
.wl-post-stats {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
}
.wl-ps-card {
  flex: 1; min-width: 90px;
  background: #fff; border: 1.5px solid var(--c-bdr);
  border-radius: var(--r2); padding: 10px 14px; text-align: center;
  position: relative; overflow: hidden;
}
.wl-ps-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.wl-ps-card.morning::before { background: #f97316; }
.wl-ps-card.evening::before { background: #6366f1; }
.wl-ps-card.dual::before    { background: linear-gradient(90deg,#f97316,#6366f1); }
.wl-ps-num { font-size: 26px; font-weight: 900; line-height: 1; color: var(--c-t1); }
.wl-ps-lbl { font-size: 11px; font-weight: 700; color: var(--c-t3); margin-top: 4px; }
.wl-ps-unit{ font-size: 11px; color: var(--c-t4); margin-top: 1px; }
/* 月次リスト */
.wl-month-list { display: flex; flex-direction: column; gap: 6px; }
.wl-month-entry { display: grid; grid-template-columns: 32px 1fr; gap: 6px; align-items: start; }
.wl-month-date { font-size: 10px; font-weight: 700; color: var(--c-t4); padding-top: 2px; }
.wl-month-wl { font-size: 11.5px; line-height: 1.5; }
/* 月次ランキング */
.wl-rankings-wrap {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;
}
.wl-rankings-wrap.daily4 {
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
}
@media (max-width: 640px) { .wl-rankings-wrap { grid-template-columns: 1fr; } }
.wl-ranking {
  background: linear-gradient(135deg, #fefce8 0%, #eff6ff 100%);
  border: 1.5px solid #fcd34d; border-radius: var(--r); padding: 16px 20px;
}
.wl-ranking.refl {
  background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
  border-color: #6ee7b7;
}
.wl-ranking.week-wins {
  background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
  border-color: #38bdf8;
}
.wl-ranking.week-wins .wl-ranking-ttl { color: #0369a1; }
.wl-ranking.week-wins .wl-rank-row { border-color: rgba(56,189,248,.3); }
.wl-ranking.week-wins .wl-rank-score { color: #0369a1; }
.wl-ranking.alert-morn {
  background: linear-gradient(135deg, #fff7ed 0%, #fef9c3 100%);
  border-color: #fbbf24;
}
.wl-ranking.alert-morn .wl-ranking-ttl { color: #78350f; }
.wl-ranking.alert-unposted {
  background: linear-gradient(135deg, #fff5f5 0%, #fef2f2 100%);
  border-color: #fca5a5;
}
.wl-ranking.alert-unposted .wl-ranking-ttl { color: #b91c1c; cursor: pointer; }
.wl-ranking.alert-unposted .wl-ranking-ttl:hover { opacity: .8; }
.wl-ranking.alert-unposted .wl-alert-row { border-color: rgba(252,165,165,.3); }
.wl-ranking.post-rate-high {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border-color: #86efac;
}
.wl-ranking.post-rate-high .wl-ranking-ttl { color: #15803d; cursor: pointer; }
.wl-ranking.post-rate-high .wl-ranking-ttl:hover { opacity: .8; }
.wl-ranking.post-rate-high .wl-alert-row { border-color: rgba(134,239,172,.3); }
.wl-ranking-ttl {
  font-size: 13px; font-weight: 900; color: #92400e; letter-spacing: .02em;
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.wl-ranking.refl .wl-ranking-ttl { color: #065f46; }
.wl-ranking.refl .wl-rank-row { border-color: rgba(110,231,183,.4); }
.wl-ranking.refl .wl-rank-score { color: #059669; }
.wl-rank-list { display: flex; flex-direction: column; gap: 7px; max-height: 260px; overflow-y: auto; }
.wl-rank-row {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 10px;
  align-items: center; padding: 7px 12px;
  background: rgba(255,255,255,.7); border-radius: 8px;
  border: 1px solid rgba(253,211,77,.4);
}
.wl-rank-num {
  font-size: 16px; font-weight: 900; text-align: center;
}
.wl-rank-num.r1 { color: #d97706; }
.wl-rank-num.r2 { color: #6b7280; }
.wl-rank-num.r3 { color: #92400e; }
.wl-rank-num.r4, .wl-rank-num.r5 { color: #9ca3af; font-size: 13px; }
.wl-rank-info { min-width: 0; }
.wl-rank-name { font-size: 13px; font-weight: 700; color: var(--c-t1); }
.wl-rank-sub  { font-size: 10.5px; color: var(--c-t3); margin-top: 1px; }
.wl-rank-score {
  font-size: 18px; font-weight: 900; color: #1d4ed8;
  white-space: nowrap;
}
.wl-rank-score span { font-size: 10.5px; font-weight: 600; color: var(--c-t3); }
.wl-ranking-ttl { cursor: pointer; user-select: none; }
.wl-ranking-ttl:hover { opacity: .8; }
.wl-rank-toggle { margin-left: auto; font-size: 11px; color: var(--c-t3); font-weight: 600; }
.wl-rank-more {
  width: 100%; margin-top: 8px; padding: 5px 0;
  background: transparent; border: none;
  font-size: 11px; font-weight: 700; color: var(--c-t3);
  cursor: pointer; text-align: center; letter-spacing: .03em;
}
.wl-rank-more:hover { color: var(--c-t1); }
.wl-alert-row {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  align-items: center; padding: 6px 12px;
  background: rgba(255,255,255,.75); border-radius: 8px;
  border: 1px solid rgba(251,191,36,.3);
}
.wl-alert-ok {
  text-align: center; padding: 14px 0;
  color: #16a34a; font-size: 13px; font-weight: 700;
}

/* ── バディくんチャット ── */
.buddy-toggle-btn {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%);
  background: linear-gradient(180deg,#16a34a,#15803d);
  color: #fff; border: none; border-radius: 12px 0 0 12px;
  padding: 14px 9px; cursor: pointer; z-index: 300;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow: -3px 0 14px rgba(0,0,0,.18); transition: background .15s;
}
.buddy-toggle-btn:hover { background: linear-gradient(180deg,#15803d,#166534); }
.buddy-toggle-ico { font-size: 20px; }
.buddy-toggle-txt { writing-mode: vertical-rl; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; }
.buddy-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 380px;
  background: var(--c-sur); border-left: 1.5px solid var(--c-bdr2);
  display: flex; flex-direction: column; z-index: 250;
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow: -6px 0 32px rgba(0,0,0,.13);
}
.buddy-panel.open { transform: translateX(0); }
.buddy-hd {
  display: flex; align-items: center; gap: 10px; padding: 15px 16px;
  border-bottom: 1.5px solid var(--c-bdr2);
  background: linear-gradient(135deg,#f0fdf4 0%,#fff 100%); flex-shrink: 0;
}
.buddy-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg,#16a34a,#4ade80);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(22,163,74,.3);
}
.buddy-hd-info { flex: 1; min-width: 0; }
.buddy-hd-name { font-size: 15px; font-weight: 800; color: var(--c-t1); }
.buddy-hd-desc { font-size: 10.5px; color: var(--c-t3); }
.buddy-close {
  background: none; border: none; cursor: pointer; color: var(--c-t3);
  font-size: 20px; padding: 4px 6px; border-radius: 6px; line-height: 1;
}
.buddy-close:hover { background: var(--c-bdr); color: var(--c-t1); }
.buddy-suggestions {
  display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 12px;
  border-bottom: 1px solid var(--c-bdr); flex-shrink: 0; background: #fafffe;
}
.buddy-chip {
  background: var(--c-pri-s); color: var(--c-pri); border: 1px solid var(--c-bdr2);
  border-radius: 100px; padding: 4px 11px; font-size: 11.5px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .12s;
}
.buddy-chip:hover { background: #bbf7d0; }
.buddy-msgs {
  flex: 1; overflow-y: auto; padding: 14px 12px;
  display: flex; flex-direction: column; gap: 12px;
}
.buddy-msg { display: flex; gap: 8px; align-items: flex-start; }
.buddy-msg.user { flex-direction: row-reverse; }
.buddy-msg-ico {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.buddy-msg.assistant .buddy-msg-ico { background: linear-gradient(135deg,#16a34a,#4ade80); }
.buddy-msg.user .buddy-msg-ico { background: var(--c-bdr2); color: var(--c-t3); }
.buddy-bubble {
  max-width: 84%; padding: 9px 13px; font-size: 13px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
.buddy-msg.assistant .buddy-bubble {
  background: #f0fdf4; border: 1px solid var(--c-bdr2); color: var(--c-t1);
  border-radius: 4px 14px 14px 14px;
}
.buddy-msg.user .buddy-bubble {
  background: var(--c-pri); color: #fff;
  border-radius: 14px 4px 14px 14px;
}

.buddy-typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--c-pri); animation: bdot 1.2s infinite; }

.buddy-typing span:nth-child(3) { animation-delay: .4s; }

}
.buddy-send:hover { background: var(--c-pri-h); }
.buddy-send:disabled { background: var(--c-bdr2); cursor: not-allowed; }
</style>
</head>

<script>
/* ════════════════════════════════════════
   State
════════════════════════════════════════ */
const S = {
  view:     'wins',
  sub:      'day',
  date:     today(),
  weekDate: today(),
  dash:      null,
  weekly:    null,
  members:   null,
  groups:    null,
  config:    null,
  dashUsers:   null,
  invitations: null,
  loading:   false,
  role:      'member',
  email:     '',
  displayName: '',
  winsPeriod: 'daily',
  winsRange:  {},
};

function today() {
  return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
}
function addDays(d, n) {
  return new Date(new Date(d + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
}
function weekStart(d) {
  const dt = new Date(d + 'T00:00:00Z');
  const off = dt.getUTCDay() === 0 ? 6 : dt.getUTCDay() - 1;
  return addDays(d, -off);
}
function fmtWeekLabel(d) {
  const dt = new Date(d + 'T00:00:00Z');
  return `${dt.getUTCMonth()+1}月${dt.getUTCDate()}日`;
}
function fmtDayHd(d) {
  const dt  = new Date(d + 'T00:00:00Z');
  const day = ['日','月','火','水','木','金','土'][dt.getUTCDay()];
  return `${day}\n${dt.getUTCMonth()+1}/${dt.getUTCDate()}`;
}
function isWkend(d) { const w = new Date(d + 'T00:00:00Z').getUTCDay(); return w===0||w===6; }

/* ════════════════════════════════════════
   Navigation
════════════════════════════════════════ */
const ROLE_ALLOWED = {
  admin:     null,               // null = 全ページ許可
  executive: ['wins'],
  member:    ['wins'],
};
function nav(view) {
  const allowed = ROLE_ALLOWED[S.role];
  if (allowed && !allowed.includes(view)) return;
  S.view = view;
  document.querySelectorAll('.nv').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  render();
}

/* ════════════════════════════════════════
   API
════════════════════════════════════════ */
async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { window.location.href = '/login.html'; return {}; }
  return res.json();
}

/* ════════════════════════════════════════
   Toast
════════════════════════════════════════ */
let _tt;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast on ${type==='ok'?'to-ok':type==='err'?'to-err':''}`;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), 3000);
}

/* ════════════════════════════════════════
   Fetch
════════════════════════════════════════ */
async function fetchDash() {
  S.loading = true; render();
  try {
    S.dash = await api('GET', `/api/dashboard?date=${S.date}`);
    updateSB(S.dash);
  } catch(e) { console.error(e); }
  S.loading = false; render();
}
async function fetchMembers() { const [m,g] = await Promise.all([api('GET','/api/members'), api('GET','/api/groups')]); S.members=m; S.groups=g; }
async function fetchDashUsers() {
  const [users, invs] = await Promise.all([api('GET', '/api/users'), api('GET', '/api/invitations')]);
  S.dashUsers   = users;
  S.invitations = invs;
}
async function fetchGroups()  { S.groups  = await api('GET', '/api/groups'); }
async function fetchConfig()  { S.config  = await api('GET', '/api/config'); }

function updateSB(d) {
  const ce = document.getElementById('sb-cron');
  if (ce && d.config?.summary_cron) ce.textContent = `自動: ${d.config.summary_cron}`;
}

/* ════════════════════════════════════════
   Render
════════════════════════════════════════ */
function render() {
  const page = document.getElementById('page');
  if (S.loading) { page.innerHTML = `<div class="spin-wrap"><div class="spinner"></div></div>`; return; }
  switch (S.view) {
    case 'wins':     page.innerHTML = renderWinsV();    break;
    case 'members':  page.innerHTML = renderMembersV(); break;
    case 'groups':   page.innerHTML = renderGroupsV();  break;
    case 'settings': page.innerHTML = renderSettingsV(); break;
    case 'users':    page.innerHTML = renderUsersV(); break;
  }
  bindEvt();
}

/* ════════════════════════════════════════
   Members view
════════════════════════════════════════ */
function renderMembersV() {
  if (!S.members) { fetchMembers().then(render); return `<div class="spin-wrap"><div class="spinner"></div></div>`; }

  const gOptItems = [`<option value="">（未分類）</option>`];
  const topGs = S.groups.filter(g => !g.parent_id);
  const topIds = new Set(topGs.map(g => g.id));
  const l2Gs  = S.groups.filter(g => g.parent_id && topIds.has(g.parent_id));
  const l2Ids = new Set(l2Gs.map(g => g.id));
  const l3Gs  = S.groups.filter(g => g.parent_id && l2Ids.has(g.parent_id));
  for (const top of topGs) {
    gOptItems.push(`<option value="${top.id}">${top.name}</option>`);
    for (const l2 of l2Gs.filter(c => c.parent_id === top.id)) {
      gOptItems.push(`<option value="${l2.id}">　└ ${l2.name}</option>`);
      for (const l3 of l3Gs.filter(c => c.parent_id === l2.id)) {
        gOptItems.push(`<option value="${l3.id}">　　└ ${l3.name}</option>`);
      }
    }
  }
  const gOpts = gOptItems.join('');

  const rows = S.members.map(m => {
    const name = m.real_name || m.display_name || m.user_id;
    const sel  = gOpts.replace(`value="${m.group_id??''}"`, `value="${m.group_id??''}" selected`);
    return `<div class="cr">
      <div style="flex:1;min-width:0">
        <div class="cr-lbl" style="${m.is_active?'':'color:var(--c-t3)'}">${name}
          ${m.is_active?'':'<span class="chip c-x" style="font-size:11px;margin-left:6px">停止中</span>'}
        </div>
        <div class="cr-desc">${m.user_id}</div>
      </div>
      <div class="cr-ctrl">
        <select class="inp" style="width:158px" onchange="patchM('${m.user_id}','group_id',this.value||null)">${sel}</select>
        <button class="mon-btn ${m.is_active?'mon-on':'mon-off'}" onclick="toggleMon('${m.user_id}',${m.is_active?0:1})">
          ${m.is_active?'✓ 監視中':'停止中'}
        </button>
      </div>
    </div>`;
  }).join('');

  return `<div class="topbar">
    <div class="tb-left"><div class="tb-title">メンバー管理</div><div class="tb-sub">グループ割り当てと監視オン/オフ</div></div>
    <button class="btn btn-sec" onclick="syncM()">↺ Slackから同期</button>
  </div>
  <div class="card">${rows || '<div style="padding:22px;color:var(--c-t4)">メンバーなし</div>'}</div>`;
}

/* ════════════════════════════════════════
   勝ち負けBoard — 日次 / 週次 / 月次
════════════════════════════════════════ */

/* ─── 日付ヘルパー ─── */
function wlWeekRange(dateStr) {
  const d = new Date(dateStr + 'T12:00:00+09:00');
  const day = d.getDay();
  const diffToMon = day === 0 ? -6 : 1 - day;
  const mon = new Date(d); mon.setDate(d.getDate() + diffToMon);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { from: mon.toISOString().slice(0, 10), to: sun.toISOString().slice(0, 10) };
}

function wlMonthRange(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  // 2026年5月のみ例外：5月7日スタート
  const startDay = (y === 2026 && m === 5) ? '07' : '01';
  const from = `${y}-${String(m).padStart(2,'0')}-${startDay}`;
  const lastDay = new Date(y, m, 0).getDate();
  return { from, to: `${y}-${String(m).padStart(2,'0')}-${lastDay}` };
}

function wlShiftDate(dateStr, period, dir) {
  const d = new Date(dateStr + 'T12:00:00+09:00');
  if (period === 'weekly')       d.setDate(d.getDate() + dir * 7);
  else if (period === 'monthly') d.setMonth(d.getMonth() + dir);
  return d.toISOString().slice(0, 10);
}

async function fetchWinsRange(from, to) {
  const key = `${from}_${to}`;
  if (S.winsRange[key]) return S.winsRange[key];
  const r = await api('GET', `/api/wins-range?from=${from}&to=${to}`);
  S.winsRange[key] = r;
  return r;
}

/* ─── エントリーポイント ─── */
function renderWinsV() {
  const period = S.winsPeriod || 'daily';

  // 月次データを常にバックグラウンドで確保（全タブでランキングに使用）
  const monthRange = wlMonthRange(S.date);
  const monthKey   = `${monthRange.from}_${monthRange.to}`;
  if (!S.winsRange[monthKey]) fetchWinsRange(monthRange.from, monthRange.to).then(render);
  const monthData  = S.winsRange[monthKey] || null;
  const ranking    = monthData
    ? wlRankings(monthData.members)
    : `<div style="padding:8px 20px 4px;color:var(--c-t4);font-size:12px">🏆📝 月次ランキング集計中...</div>`;

  if (period === 'daily') {
    if (!S.dash || S.dash.date !== S.date) {
      fetchDash().then(render);
      return `<div class="spin-wrap"><div class="spinner"></div></div>`;
    }
    const dailyRanking = monthData
      ? wlRankingsDaily(monthData.members, S.dash)
      : `<div style="padding:8px 20px 4px;color:var(--c-t4);font-size:12px">🏆📝 月次ランキング集計中...</div>`;
    return wlBar(period) + wlHeroDaily(S.dash) + dailyRanking + wlBodyDaily(S.dash);
  }

  const range = period === 'weekly' ? wlWeekRange(S.date) : monthRange;
  const key   = `${range.from}_${range.to}`;
  if (!S.winsRange[key]) {
    fetchWinsRange(range.from, range.to).then(render);
    return `<div class="spin-wrap"><div class="spinner"></div></div>`;
  }
  const data = S.winsRange[key];
  // 週次タブは「今週」の数字だけを表示（月間ランキングは月次タブのみ）
  if (period === 'weekly') return wlBar(period, range) + wlBodyWeekly(data);
  return wlBar(period, range) + ranking + wlBodyMonthly(data);
}

/* ─── トップバー ─── */
function wlBar(period, range) {
  const tabs = ['daily','weekly','monthly'].map(p => {
    const lbl = p === 'daily' ? '日次' : p === 'weekly' ? '週次' : '月次';
    return `<button class="wl-period-tab${p === period ? ' active' : ''}" onclick="S.winsPeriod='${p}';render()">${lbl}</button>`;
  }).join('');

  let nav = '';
  if (period === 'daily') {
    nav = `<input class="inp" type="date" id="w-inp" value="${S.date}" max="${today()}" style="width:148px">`;
  } else {
    const prev = wlShiftDate(S.date, period, -1);
    const next  = wlShiftDate(S.date, period, +1);
    const isFuture = next > today();
    let label = '';
    if (period === 'weekly' && range) {
      const f = range.from.slice(5).replace('-','/'), t = range.to.slice(5).replace('-','/');
      label = `${range.from.slice(0,7)} &nbsp;${f}〜${t}`;
    } else if (period === 'monthly' && range) {
      const [y,m] = range.from.split('-');
      label = `${y}年${parseInt(m)}月`;
    }
    nav = `<div class="wl-period-nav">
      <button class="wl-nav-btn" onclick="S.date='${prev}';S.winsRange={};render()">◀</button>
      <div class="wl-period-range">${label}</div>
      <button class="wl-nav-btn" onclick="S.date='${next}';S.winsRange={};render()" ${isFuture ? 'disabled style="opacity:.4"' : ''}>▶</button>
    </div>`;
  }

  const subLabel = period === 'daily' ? S.date + ' — 今日の勝ち・負け'
    : period === 'weekly' ? '週次集計 — 曜日ごとの勝ち・負け'
    : '月次集計 — 月間の勝ち・負け一覧';

  return `<div class="topbar">
    <div class="tb-left">
      <div class="tb-title">🏆 勝ち負けBoard</div>
      <div class="tb-sub"><span class="live-dot"></span>${subLabel}</div>
    </div>
    <div class="tb-right" style="gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <div class="wl-period-tabs">${tabs}</div>
      ${nav}
      <button class="btn btn-sec" onclick="${period === 'daily' ? 'fetchDash().then(render)' : 'S.winsRange={};render()'}">↺ 更新</button>
      ${S.role === 'admin' ? `<button class="btn btn-pri" id="wl-run-btn" onclick="wlRunCheck()" style="white-space:nowrap">▶ チェック実行</button>` : ''}
    </div>
  </div>`;
}

/* ─── 日次ヒーロー ─── */
function wlPostStatsRow(morningN, eveningN, dualN, unit) {
  return `<div class="wl-post-stats">
    <div class="wl-ps-card morning">
      <div class="wl-ps-num">${morningN}</div>
      <div class="wl-ps-lbl">☀️ 朝投稿</div>
      <div class="wl-ps-unit">${unit}</div>
    </div>
    <div class="wl-ps-card evening">
      <div class="wl-ps-num">${eveningN}</div>
      <div class="wl-ps-lbl">🌙 夜投稿</div>
      <div class="wl-ps-unit">${unit}</div>
    </div>
    <div class="wl-ps-card dual">
      <div class="wl-ps-num">${dualN}</div>
      <div class="wl-ps-lbl">☀️🌙 2回投稿</div>
      <div class="wl-ps-unit">${unit}</div>
    </div>
  </div>`;
}

function wlHeroDaily(dash) {
  const all        = dash.members;
  const posted     = all.filter(m => m.check?.posted);
  // 勝率の母数は「勝敗を記入した日」のみ（勝ち=wins_text / 負け=losses_text）
  const withWins   = posted.filter(m => m.check?.wins_text);
  const withLosses = posted.filter(m => !m.check?.wins_text && m.check?.losses_text);
  const notPosted  = all.filter(m => !m.check?.posted);
  const refScores  = posted.map(m => m.check?.reflection_score).filter(s => s != null);
  const avgRef     = refScores.length ? refScores.reduce((a,b) => a+b, 0) / refScores.length : null;

  const morningN = posted.filter(m => m.check?.morning_posted).length;
  const eveningN = posted.filter(m => m.check?.evening_posted).length;
  const dualN    = posted.filter(m => m.check?.morning_posted && m.check?.evening_posted).length;

  const judged   = withWins.length + withLosses.length;
  const winRate  = judged > 0 ? Math.round(withWins.length / judged * 100) : null;

  return `<div class="wl-hero">
    <div class="wl-hero-card wins">
      <div class="wl-hero-num" style="color:#1d4ed8">${withWins.length}</div>
      <div class="wl-hero-lbl" style="color:#1d4ed8">🏆 勝ち</div>
    </div>
    <div class="wl-hero-card losses">
      <div class="wl-hero-num" style="color:#7c3aed">${withLosses.length}</div>
      <div class="wl-hero-lbl" style="color:#7c3aed">💪 負け</div>
    </div>
    <div class="wl-hero-card" style="background:#fffbeb;border:2px solid #fcd34d">
      <div class="wl-hero-num" style="color:#b45309">${winRate != null ? winRate + '%' : '—'}</div>
      <div class="wl-hero-lbl" style="color:#b45309">📊 勝率 (${withWins.length}/${judged})</div>
    </div>
    <div class="wl-hero-card refl">
      <div class="wl-hero-num" style="color:#c2410c">${avgRef != null ? avgRef.toFixed(2) : '—'}</div>
      <div class="wl-hero-lbl" style="color:#c2410c">📝 平均振返スコア</div>
    </div>
    ${notPosted.length ? `<div class="wl-hero-card" style="background:#fff5f5;border:2px solid var(--c-redBr)">
      <div class="wl-hero-num" style="color:var(--c-red)">${notPosted.length}</div>
      <div class="wl-hero-lbl" style="color:var(--c-red)">📭 未投稿</div>
    </div>` : ''}
  </div>
  ${wlPostStatsRow(morningN, eveningN, dualN, '人')}`;
}

/* ─── 振返レベルラベル ─── */
function reflLevelLabel(score) {
  if (score == null) return null;
  if (score >= 0.80) return { lbl: '深い振り返り',       color: '#16a34a' };
  if (score >= 0.60) return { lbl: '標準的な振り返り',   color: '#2563eb' };
  if (score >= 0.40) return { lbl: 'やや浅い振り返り',   color: '#d97706' };
  return               { lbl: '振り返りが浅め',         color: '#dc2626' };
}

function wlNoteRow(score, growthNote) {
  const lv = reflLevelLabel(score);
  if (!lv && !growthNote) return '';
  const lblHtml  = lv ? `<span class="wl-refl-lbl" style="color:${lv.color}">📝 ${lv.lbl}（${score.toFixed(2)}）</span>` : '';
  const noteHtml = growthNote ? `<span class="wl-growth-txt">→ ${growthNote}</span>` : '';
  return `<div class="wl-card-note">${lblHtml}${noteHtml}</div>`;
}

/* ─── 日次メンバーカード ─── */
function renderWlCard(m) {
  const { user, check } = m;
  const name = user.real_name || user.display_name || user.user_id;
  const grp  = user.group ? (user.group.parent?.name ? `${user.group.parent.name} › ${user.group.name}` : user.group.name) : '';

  if (!check?.posted) {
    return `<div class="wl-card wl-nopost">
      <div>
        <div class="wl-card-name">${name}</div>
        ${grp ? `<div class="wl-card-meta">${grp}</div>` : ''}
      </div>
      <span class="wl-verdict none">📭 未投稿</span>
    </div>`;
  }

  const postIco  = `${check.morning_posted ? '☀️' : ''}${check.evening_posted ? '🌙' : ''}`;
  const ref      = check.reflection_score;
  const refStr   = ref != null ? `<span style="color:#c2410c;font-size:12px;font-weight:600">📝${ref.toFixed(2)}</span>` : '';
  const verdict  = check.wins_text
    ? `<span class="wl-verdict win">🏆 勝ち</span>`
    : check.losses_text
    ? `<span class="wl-verdict loss">💪 負け</span>`
    : `<span class="wl-verdict none">－ 判定なし</span>`;

  return `<div class="wl-card">
    <div>
      <div class="wl-card-name">${name}</div>
      <div class="wl-card-meta">${grp ? grp + ' ·' : ''} <span>${postIco}</span></div>
    </div>
    <div class="wl-row-stats">${verdict}${refStr}</div>
    ${wlNoteRow(ref, check.growth_note)}
  </div>`;
}

function wlDeptBlock(dept, direct, cardFn) {
  const all = [
    ...(dept.children||[]).flatMap(c => [...(c.members||[]), ...(c.children||[]).flatMap(gc => gc.members||[])]),
    ...(direct||[])
  ];
  if (!all.length) return '';
  const sigSort = m => m.check?.wins_text?0:m.check?.posted?1:2;
  const pc = all.filter(m => m.check?.posted).length;
  const wc = all.filter(m => m.check?.wins_text).length;
  const lc = all.filter(m => !m.check?.wins_text && m.check?.losses_text).length;

  let body = '';
  for (const child of (dept.children||[])) {
    const childAll = [...(child.members||[]), ...(child.children||[]).flatMap(gc => gc.members||[])];
    if (!childAll.length) continue;
    const sgPc = childAll.filter(m => m.check?.posted).length;
    const sgWc = childAll.filter(m => m.check?.wins_text).length;
    const sgLc = childAll.filter(m => !m.check?.wins_text && m.check?.losses_text).length;
    body += `<div class="wl-sub-dept">
      <div class="wl-sub-dept-ttl">▸ ${child.name}
        <span style="font-size:11px;color:var(--c-t3)">${sgPc}/${childAll.length}名</span>
        <span style="font-size:11px;color:#1d4ed8">🏆${sgWc}</span>
        <span style="font-size:11px;color:#7c3aed">💪${sgLc}</span>
      </div>`;
    if ((child.members||[]).length) {
      const sorted = [...child.members].sort((a,b) => sigSort(a) - sigSort(b));
      body += `<div class="wl-grid">${sorted.map(m => cardFn(m)).join('')}</div>`;
    }
    for (const gc of (child.children||[])) {
      if (!gc.members?.length) continue;
      const gcSorted = [...gc.members].sort((a,b) => sigSort(a) - sigSort(b));
      const gcPc = gc.members.filter(m => m.check?.posted).length;
      body += `<div class="wl-sub-dept-ttl" style="margin-left:16px">└ ${gc.name}
        <span style="font-size:11px;color:var(--c-t3)">${gcPc}/${gc.members.length}名</span>
      </div>`;
      body += `<div class="wl-grid" style="margin-left:16px">${gcSorted.map(m => cardFn(m)).join('')}</div>`;
    }
    body += `</div>`;
  }
  if ((direct||[]).length) {
    const sorted = [...direct].sort((a,b) => sigSort(a) - sigSort(b));
    body += `<div class="wl-grid">${sorted.map(m => cardFn(m)).join('')}</div>`;
  }

  return `<div class="sec">
    <div class="wl-dept-ttl">🏢 ${dept.name}
      <span style="font-size:12px;font-weight:600;color:var(--c-t3)">${pc}/${all.length}名投稿</span>
      <span style="font-size:12px;color:#1d4ed8;font-weight:600">🏆${wc}</span>
      <span style="font-size:12px;color:#7c3aed;font-weight:600">💪${lc}</span>
    </div>
    ${body}
  </div>`;
}

function wlBodyDaily(dash) {
  const { group_tree, ungrouped } = dash;
  const rateGrid = wlOrgRateGridDaily(dash);
  const depts = [
    ...group_tree.map(g => wlDeptBlock(g, g.direct_members, renderWlCard)),
    ...(ungrouped?.length ? [wlDeptBlock({name:'未分類',children:[]}, ungrouped, renderWlCard)] : []),
  ].filter(Boolean).join('');
  return rateGrid + (depts || `<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">データなし</div><p>「チェック実行」を押してください。</p></div>`);
}

/* ─── 週次 ─── */
const WL_DAY_JA = ['日','月','火','水','木','金','土'];

function renderWlWeekCard(m) {
  const name = m.user.real_name || m.user.display_name || m.user.user_id;
  const grp  = m.user.group ? (m.user.group.parent?.name ? `${m.user.group.parent.name} › ${m.user.group.name}` : m.user.group.name) : '';
  const { summary, days } = m;

  // 平日（月〜金）のみ、日付順にソート
  const weekdays = Object.entries(days)
    .filter(([date]) => { const dow = new Date(date + 'T12:00:00Z').getDay(); return dow >= 1 && dow <= 5; })
    .sort(([a], [b]) => a.localeCompare(b));

  // 平日ベースの勝ち/負けカウント（母数は勝敗を記入した日のみ）
  const wdWins   = weekdays.filter(([, d]) => d.wins_text).length;
  const wdLosses = weekdays.filter(([, d]) => !d.wins_text && d.losses_text).length;

  // カレンダーセル
  const calCells = weekdays.map(([date, d]) => {
    const dow = WL_DAY_JA[new Date(date + 'T12:00:00Z').getDay()];
    const md  = date.slice(5).replace('-', '/');
    const cls = !d.posted ? 'np' : d.wins_text ? 'win' : d.losses_text ? 'loss' : 'none';
    const val = cls === 'win' ? '勝' : cls === 'loss' ? '負' : cls === 'none' ? '・' : '−';
    const tip = `${dow} ${md}: ${cls === 'win' ? '🏆勝ち' : cls === 'loss' ? '💪負け' : cls === 'none' ? '判定なし（投稿あり）' : '未投稿'}`;
    return `<div class="wl-wc-cell ${cls}" title="${tip}">
      <div class="wl-wc-dow">${dow}</div>
      <div class="wl-wc-val">${val}</div>
      <div class="wl-wc-date">${md}</div>
    </div>`;
  }).join('');

  return `<div class="wl-card wl-week-card">
    <div class="wl-wcard-header">
      <div>
        <div class="wl-card-name">${name}</div>
        ${grp ? `<div class="wl-card-meta">${grp}</div>` : ''}
      </div>
      <div class="wl-wcard-record">
        <div class="wl-wcard-score-item">
          <div class="wl-wcard-score-num" style="color:#1d4ed8">${wdWins}</div>
          <div class="wl-wcard-score-lbl">🏆 勝</div>
        </div>
        <div class="wl-wcard-score-item">
          <div class="wl-wcard-score-num" style="color:#7c3aed">${wdLosses}</div>
          <div class="wl-wcard-score-lbl">💪 敗</div>
        </div>
      </div>
    </div>
    ${weekdays.length ? `<div class="wl-week-cal">${calCells}</div>` : ''}
  </div>`;
}

function wlHeroRange(members, zeroLabel) {
  const posted    = members.filter(m => m.summary.posted_count > 0);
  const notPosted = members.filter(m => m.summary.posted_count === 0);
  const totalWins      = posted.reduce((s,m) => s + m.summary.wins_count, 0);
  const totalLosses    = posted.reduce((s,m) => s + m.summary.losses_count, 0);
  const totalJudged    = totalWins + totalLosses;
  const winRate        = totalJudged > 0 ? Math.round(totalWins / totalJudged * 100) : null;
  const refScores   = posted.map(m => m.summary.avg_reflection).filter(s => s != null);
  const avgRef      = refScores.length ? refScores.reduce((a,b) => a+b, 0) / refScores.length : null;

  // 朝/夜/2回投稿（延べ日数）
  const allDays    = m => Object.values(m.days || {});
  const morningN   = members.reduce((s,m) => s + allDays(m).filter(d => d.morning_posted).length, 0);
  const eveningN   = members.reduce((s,m) => s + allDays(m).filter(d => d.evening_posted).length, 0);
  const dualN      = members.reduce((s,m) => s + allDays(m).filter(d => d.morning_posted && d.evening_posted).length, 0);

  return `<div class="wl-hero">
    <div class="wl-hero-card wins">
      <div class="wl-hero-num" style="color:#1d4ed8">${totalWins}</div>
      <div class="wl-hero-lbl" style="color:#1d4ed8">🏆 勝ち（延べ）</div>
    </div>
    <div class="wl-hero-card losses">
      <div class="wl-hero-num" style="color:#7c3aed">${totalLosses}</div>
      <div class="wl-hero-lbl" style="color:#7c3aed">💪 負け（延べ）</div>
    </div>
    <div class="wl-hero-card" style="background:#fffbeb;border:2px solid #fcd34d">
      <div class="wl-hero-num" style="color:#b45309">${winRate != null ? winRate + '%' : '—'}</div>
      <div class="wl-hero-lbl" style="color:#b45309">📊 勝率 (${totalWins}/${totalJudged})</div>
    </div>
    <div class="wl-hero-card refl">
      <div class="wl-hero-num" style="color:#c2410c">${avgRef != null ? avgRef.toFixed(2) : '—'}</div>
      <div class="wl-hero-lbl" style="color:#c2410c">📝 平均振返スコア</div>
    </div>
    ${notPosted.length ? `<div class="wl-hero-card" style="background:#fff5f5;border:2px solid var(--c-redBr)">
      <div class="wl-hero-num" style="color:var(--c-red)">${notPosted.length}</div>
      <div class="wl-hero-lbl" style="color:var(--c-red)">📭 ${zeroLabel}</div>
    </div>` : ''}
  </div>
  ${wlPostStatsRow(morningN, eveningN, dualN, '日（延べ）')}`;
}

/* ─── 組織別投稿率カード ─── */
function calcWlDailyOrgRates(members) {
  const total = members.length;
  if (!total) return null;
  const mn = members.filter(m => m.check?.morning_posted).length;
  const en = members.filter(m => m.check?.evening_posted).length;
  const dn = members.filter(m => m.check?.morning_posted && m.check?.evening_posted).length;
  return { morningPct: Math.round(mn/total*100), eveningPct: Math.round(en/total*100), dualPct: Math.round(dn/total*100) };
}

function calcWlRangeOrgRates(members) {
  if (!members.length) return null;
  let mSum = 0, eSum = 0, dSum = 0, daySum = 0;
  for (const m of members) {
    const vals = Object.values(m.days || {});
    daySum += vals.length;
    mSum += vals.filter(d => d.morning_posted).length;
    eSum += vals.filter(d => d.evening_posted).length;
    dSum += vals.filter(d => d.morning_posted && d.evening_posted).length;
  }
  if (!daySum) return { morningPct: 0, eveningPct: 0, dualPct: 0 };
  return { morningPct: Math.round(mSum/daySum*100), eveningPct: Math.round(eSum/daySum*100), dualPct: Math.round(dSum/daySum*100) };
}

function wlOrgRateCard(name, rates, isChild) {
  if (!rates) return '';
  const cell = (lbl, pct, color) => {
    const cl = pct >= 80 ? 'var(--c-pri)' : pct >= 50 ? '#f59e0b' : 'var(--c-red)';
    const tc = pct >= 80 ? 'var(--c-pri)' : pct >= 50 ? '#92400e' : 'var(--c-red)';
    return `<div class="wl-org-rate-cell">
      <div class="wl-org-rate-lbl" style="color:${color}">${lbl}</div>
      <div class="wl-org-rate-pct" style="color:${tc}">${pct}%</div>
      <div class="wl-org-rate-bar"><div class="wl-org-rate-fill" style="width:${pct}%;background:${cl}"></div></div>
    </div>`;
  };
  return `<div class="wl-org-rate-card${isChild?' child':''}">
    <div class="wl-org-rate-name">${name}</div>
    <div class="wl-org-rate-row">
      ${cell('☀️ 朝', rates.morningPct, '#f97316')}
      ${cell('🌙 夜', rates.eveningPct, '#6366f1')}
      ${cell('☀️🌙 2回', rates.dualPct, 'var(--c-t3)')}
    </div>
  </div>`;
}

function wlOrgRateGridDaily(dash) {
  const { group_tree, ungrouped } = dash;
  const cards = [];
  for (const top of (group_tree||[])) {
    const topMs = [
      ...(top.children||[]).flatMap(c => [...(c.members||[]), ...(c.children||[]).flatMap(gc => gc.members||[])]),
      ...(top.direct_members||[])
    ];
    if (!topMs.length) continue;
    cards.push(wlOrgRateCard('🏢 ' + top.name, calcWlDailyOrgRates(topMs), false));
    for (const child of (top.children||[])) {
      const childMs = [...(child.members||[]), ...(child.children||[]).flatMap(gc => gc.members||[])];
      if (!childMs.length) continue;
      cards.push(wlOrgRateCard('▸ ' + child.name, calcWlDailyOrgRates(childMs), true));
    }
  }
  if (ungrouped?.length) cards.push(wlOrgRateCard('未分類', calcWlDailyOrgRates(ungrouped), true));
  return cards.length ? `<div class="wl-org-rate-grid">${cards.join('')}</div>` : '';
}

function wlOrgRateGridRange(groups, ungrouped) {
  const cards = [];
  for (const grp of groups) {
    const subGs = Object.values(grp.subGroups || {});
    const allMs = [...subGs.flatMap(sg => sg.members), ...(grp.direct||[])];
    if (!allMs.length) continue;
    cards.push(wlOrgRateCard('🏢 ' + grp.name, calcWlRangeOrgRates(allMs), false));
    for (const sg of subGs) {
      if (!sg.members.length) continue;
      cards.push(wlOrgRateCard('▸ ' + sg.name, calcWlRangeOrgRates(sg.members), true));
    }
  }
  if (ungrouped?.length) cards.push(wlOrgRateCard('未分類', calcWlRangeOrgRates(ungrouped), true));
  return cards.length ? `<div class="wl-org-rate-grid">${cards.join('')}</div>` : '';
}

/* ─── 組織グループ化ヘルパー（週次/月次共通） ─── */
function wlRootGroup(g) {
  if (!g) return null;
  while (g.parent) g = g.parent;
  return g;
}

// rootの直下の子グループ（第2階層）を返す
function wlSecondLevel(g, root) {
  if (!g || g.id === root.id) return null;
  if (g.parent && g.parent.id === root.id) return g;
  if (g.parent) return wlSecondLevel(g.parent, root);
  return null;
}

function wlGroupMembers(members) {
  const rootMap = {};
  const ungrouped = [];
  for (const m of members) {
    const root = wlRootGroup(m.user.group);
    if (!root) { ungrouped.push(m); continue; }
    if (!rootMap[root.id]) rootMap[root.id] = { id: root.id, name: root.name, subGroups: {}, direct: [] };
    const sub = wlSecondLevel(m.user.group, root);
    if (!sub) {
      rootMap[root.id].direct.push(m);
    } else {
      if (!rootMap[root.id].subGroups[sub.id]) rootMap[root.id].subGroups[sub.id] = { id: sub.id, name: sub.name, members: [] };
      rootMap[root.id].subGroups[sub.id].members.push(m);
    }
  }
  return { groups: Object.values(rootMap), ungrouped };
}

function wlRangeDeptBlock(grp, cardFn) {
  const subGroups     = Object.values(grp.subGroups || {});
  const directMembers = grp.direct || grp.members || [];
  const allMembers    = [...subGroups.flatMap(sg => sg.members), ...directMembers];
  if (!allMembers.length) return '';

  const sigSort = m => m.summary.wins_count>0?0:m.summary.posted_count>0?1:2;
  const pc = allMembers.filter(m => m.summary.posted_count > 0).length;
  const wc = allMembers.reduce((s,m) => s + m.summary.wins_count, 0);
  const lc = allMembers.reduce((s,m) => s + m.summary.losses_count, 0);
  const refScores = allMembers.map(m => m.summary.avg_reflection).filter(s => s != null);
  const avgRef    = refScores.length ? (refScores.reduce((a,b) => a+b,0)/refScores.length).toFixed(2) : null;

  let body = '';
  for (const sg of subGroups) {
    if (!sg.members.length) continue;
    const sorted = [...sg.members].sort((a,b) => sigSort(a) - sigSort(b));
    const sgPc = sg.members.filter(m => m.summary.posted_count > 0).length;
    const sgWc = sg.members.reduce((s,m) => s + m.summary.wins_count, 0);
    const sgLc = sg.members.reduce((s,m) => s + m.summary.losses_count, 0);
    body += `<div class="wl-sub-dept">
      <div class="wl-sub-dept-ttl">▸ ${sg.name}
        <span style="font-size:11px;color:var(--c-t3)">${sgPc}/${sg.members.length}名</span>
        <span style="font-size:11px;color:#1d4ed8">🏆${sgWc}</span>
        <span style="font-size:11px;color:#7c3aed">💪${sgLc}</span>
      </div>
      <div class="wl-grid">${sorted.map(m => cardFn(m)).join('')}</div>
    </div>`;
  }
  if (directMembers.length) {
    const sorted = [...directMembers].sort((a,b) => sigSort(a) - sigSort(b));
    body += `<div class="wl-grid">${sorted.map(m => cardFn(m)).join('')}</div>`;
  }

  return `<div class="sec">
    <div class="wl-dept-ttl">🏢 ${grp.name}
      <span style="font-size:12px;font-weight:600;color:var(--c-t3)">${pc}/${allMembers.length}名投稿</span>
      <span style="font-size:12px;color:#1d4ed8;font-weight:600">🏆${wc}</span>
      <span style="font-size:12px;color:#7c3aed;font-weight:600">💪${lc}</span>
      ${avgRef ? `<span style="font-size:12px;color:#c2410c;font-weight:600">📝${avgRef}</span>` : ''}
    </div>
    ${body}
  </div>`;
}

function wlWeekWinsRanking(members) {
  const MEDALS = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  const NUM_CLS = ['r1','r2','r3','r4','r5'];
  if (!S.wlRankExpand) S.wlRankExpand = {};
  const expanded = !!S.wlRankExpand.weekWins;

  const all = [...members]
    .map(m => ({ ...m, _judged: m.summary.wins_count + m.summary.losses_count }))
    .filter(m => m._judged > 0)
    .map(m => ({
      ...m,
      winRate: Math.round(m.summary.wins_count / m._judged * 100),
    }))
    .sort((a, b) => b.winRate - a.winRate || b.summary.wins_count - a.summary.wins_count);

  if (!all.length) return '';
  const list = expanded ? all : all.slice(0, 5);

  const rows = list.map((m, i) => {
    const medal = i < MEDALS.length ? MEDALS[i] : i + 1;
    const cls   = i < NUM_CLS.length ? NUM_CLS[i] : 'r5';
    const name  = m.user.real_name || m.user.display_name || m.user.user_id;
    const grp   = m.user.group ? (m.user.group.parent?.name ? `${m.user.group.parent.name} › ${m.user.group.name}` : m.user.group.name) : '';
    return `<div class="wl-rank-row">
      <div class="wl-rank-num ${cls}">${medal}</div>
      <div class="wl-rank-info">
        <div class="wl-rank-name">${name}</div>
        <div class="wl-rank-sub">${[grp, `${m.summary.wins_count}勝${m.summary.losses_count}敗`].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="wl-rank-score">${m.winRate}<span>%</span></div>
    </div>`;
  }).join('');

  const toggleLbl = expanded ? '▲ 閉じる' : `▼ 全${all.length}名を表示`;
  const moreBtn   = all.length > 5
    ? `<button class="wl-rank-more" onclick="S.wlRankExpand.weekWins=!S.wlRankExpand.weekWins;render()">${toggleLbl}</button>`
    : '';

  return `<div class="wl-ranking week-wins">
    <div class="wl-ranking-ttl" onclick="S.wlRankExpand.weekWins=!S.wlRankExpand.weekWins;render()">
      🏆 今週の勝率ランキング${expanded ? '' : ` TOP${list.length}`}
      <span class="wl-rank-toggle">${expanded ? '▲' : '▼'}</span>
    </div>
    <div class="wl-rank-list">${rows}</div>
    ${moreBtn}
  </div>`;
}

function wlBodyWeekly(data) {
  const { members } = data;
  const { groups, ungrouped } = wlGroupMembers(members);
  const weekRanking = wlWeekWinsRanking(members);   // 今週の勝率（週データ）
  const reflRanking = wlReflRanking(members);       // 今週の振り返り（週データ、--check時のみ）
  const rankWrap = [weekRanking, reflRanking].filter(Boolean).join('');
  const rateGrid = wlOrgRateGridRange(groups, ungrouped);
  const depts = [
    ...groups.map(g => wlRangeDeptBlock(g, renderWlWeekCard)),
    ...(ungrouped.length ? [wlRangeDeptBlock({name:'未分類', members: ungrouped}, renderWlWeekCard)] : []),
  ].filter(Boolean).join('');
  const gridCols = (weekRanking && reflRanking) ? '' : 'grid-template-columns:1fr;';
  return wlHeroRange(members, '今週ゼロ')
    + (rankWrap ? `<div class="wl-rankings-wrap" style="${gridCols}margin-bottom:16px">${rankWrap}</div>` : '')
    + rateGrid
    + (depts || `<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">データなし</div></div>`);

function renderWlMonthCard(m) {
  const name = m.user.real_name || m.user.display_name || m.user.user_id;

  const avgRef = summary.avg_reflection;
  const refStr = avgRef != null ? `<span style="color:#c2410c">📝${avgRef.toFixed(2)}</span>` : '';
  const latestNote = Object.entries(days).sort(([a],[b]) => b.localeCompare(a))
    .map(([,d]) => d.growth_note).find(n => n) || null;

  return `<div class="wl-card">
    <div>
      <div class="wl-card-name">${name}</div>

function wlWinsRanking(members) {
  const MEDALS = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  const NUM_CLS = ['r1','r2','r3','r4','r5'];
  if (!S.wlRankExpand) S.wlRankExpand = {};
  const expanded = !!S.wlRankExpand.wins;

  const all = [...members]
    .map(m => ({ ...m, _judged: m.summary.wins_count + m.summary.losses_count }))
    .filter(m => m._judged > 0)
    .map(m => ({
      ...m,
      winRate: Math.round(m.summary.wins_count / m._judged * 100),
    }))
    .sort((a, b) => b.winRate - a.winRate || b.summary.wins_count - a.summary.wins_count);

  if (!all.length) return '';
  const list = expanded ? all : all.slice(0, 5);

  const rows = list.map((m, i) => {
    const rank = i + 1;
    const medal = i < MEDALS.length ? MEDALS[i] : rank;
    const cls   = i < NUM_CLS.length ? NUM_CLS[i] : 'r5';
    const name  = m.user.real_name || m.user.display_name || m.user.user_id;
    const grp   = m.user.group ? (m.user.group.parent?.name ? `${m.user.group.parent.name} › ${m.user.group.name}` : m.user.group.name) : '';
    return `<div class="wl-rank-row">
      <div class="wl-rank-num ${cls}">${medal}</div>
      <div class="wl-rank-info">
        <div class="wl-rank-name">${name}</div>
        <div class="wl-rank-sub">${[grp, `${m.summary.wins_count}勝${m.summary.losses_count}敗`].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="wl-rank-score">${m.winRate}<span>%</span></div>
    </div>`;
  }).join('');

  const toggleLbl = expanded ? '▲ 閉じる' : `▼ 全${all.length}名を表示`;
  const moreBtn   = all.length > 5
    ? `<button class="wl-rank-more" onclick="S.wlRankExpand.wins=!S.wlRankExpand.wins;render()">${toggleLbl}</button>`
    : '';

  return `<div class="wl-ranking">
    <div class="wl-ranking-ttl" onclick="S.wlRankExpand.wins=!S.wlRankExpand.wins;render()">
      🏆 月間勝率ランキング${expanded ? '' : ` TOP${list.length}`}
      <span class="wl-rank-toggle">${expanded ? '▲' : '▼'}</span>
    </div>
    <div class="wl-rank-list">${rows}</div>
    ${moreBtn}
  </div>`;
}

function wlReflRanking(members) {
  const MEDALS = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  const NUM_CLS = ['r1','r2','r3','r4','r5'];
  if (!S.wlRankExpand) S.wlRankExpand = {};
  const expanded = !!S.wlRankExpand.refl;

  const all = [...members]
    .filter(m => m.summary.avg_reflection != null)
    .sort((a,b) => b.summary.avg_reflection - a.summary.avg_reflection);

  if (!all.length) return '';
  const list = expanded ? all : all.slice(0, 5);

  const rows = list.map((m, i) => {
    const rank  = i + 1;
    const medal = i < MEDALS.length ? MEDALS[i] : rank;
    const cls   = i < NUM_CLS.length ? NUM_CLS[i] : 'r5';
    const name  = m.user.real_name || m.user.display_name || m.user.user_id;
    const grp   = m.user.group ? (m.user.group.parent?.name ? `${m.user.group.parent.name} › ${m.user.group.name}` : m.user.group.name) : '';
    const score = m.summary.avg_reflection;
    const lv    = reflLevelLabel(score);
    return `<div class="wl-rank-row">
      <div class="wl-rank-num ${cls}">${medal}</div>
      <div class="wl-rank-info">
        <div class="wl-rank-name">${name}</div>
        <div class="wl-rank-sub">${[grp, lv ? lv.lbl : ''].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="wl-rank-score">${score.toFixed(2)}</div>
    </div>`;
  }).join('');

  const toggleLbl = expanded ? '▲ 閉じる' : `▼ 全${all.length}名を表示`;
  const moreBtn   = all.length > 5
    ? `<button class="wl-rank-more" onclick="S.wlRankExpand.refl=!S.wlRankExpand.refl;render()">${toggleLbl}</button>`
    : '';

  return `<div class="wl-ranking refl">
    <div class="wl-ranking-ttl" onclick="S.wlRankExpand.refl=!S.wlRankExpand.refl;render()">
      📝 月間振返レベルランキング${expanded ? '' : ` TOP${list.length}`}
      <span class="wl-rank-toggle">${expanded ? '▲' : '▼'}</span>
    </div>
    <div class="wl-rank-list">${rows}</div>
    ${moreBtn}
  </div>`;
}

function wlRankings(members) {
  const wins = wlWinsRanking(members);
  const refl = wlReflRanking(members);
  if (!wins && !refl) return '';
  if (!wins) return `<div class="wl-rankings-wrap" style="grid-template-columns:1fr">${refl}</div>`;
  if (!refl) return `<div class="wl-rankings-wrap" style="grid-template-columns:1fr">${wins}</div>`;
  return `<div class="wl-rankings-wrap">${wins}${refl}</div>`;
}

// 投稿率の計算（平日かつ消化日のみ）
function calcPostRates(monthMembers) {
  const isWeekday = date => { const d = new Date(date + 'T12:00:00Z').getDay(); return d >= 1 && d <= 5; };
  return [...monthMembers].map(m => {
    const weekdayEntries = Object.entries(m.days || {}).filter(([date]) => isWeekday(date) && date <= S.date);
    const totalWeekdays  = weekdayEntries.length;
    const postedWeekdays = weekdayEntries.filter(([, d]) => d.posted).length;
    const postRate       = totalWeekdays > 0 ? Math.round(postedWeekdays / totalWeekdays * 100) : 0;
    return { ...m, totalWeekdays, postedWeekdays, postRate };
  }).filter(m => m.totalWeekdays > 0);
}

function _postRateRow(m) {
  const name  = m.user.real_name || m.user.display_name || m.user.user_id;
  const grp   = m.user.group ? (m.user.group.parent?.name ? `${m.user.group.parent.name} › ${m.user.group.name}` : m.user.group.name) : '';
  const color = m.postRate >= 90 ? '#15803d' : m.postRate >= 70 ? '#d97706' : '#b91c1c';
  return `<div class="wl-alert-row">
    <div class="wl-rank-info">
      <div class="wl-rank-name">${name}</div>
      <div class="wl-rank-sub">${[grp, `${m.postedWeekdays}/${m.totalWeekdays}営業日`].filter(Boolean).join(' · ')}</div>
    </div>
    <span style="font-size:15px;font-weight:900;color:${color}">${m.postRate}<span style="font-size:10px;font-weight:600">%</span></span>
  </div>`;
}

// 投稿率ランキング（低い順）
function wlPostRateLowRanking(monthMembers) {
  if (!monthMembers) return '';
  if (!S.wlRankExpand) S.wlRankExpand = {};
  const expanded = !!S.wlRankExpand.postLow;
  const all  = calcPostRates(monthMembers).sort((a, b) => a.postRate - b.postRate || a.postedWeekdays - b.postedWeekdays);
  if (!all.length) return '';
  const list = expanded ? all : all.slice(0, 5);
  const rows = list.map(_postRateRow).join('');
  const moreBtn = all.length > 5
    ? `<button class="wl-rank-more" onclick="S.wlRankExpand.postLow=!S.wlRankExpand.postLow;render()">${expanded ? '▲ 閉じる' : `▼ 全${all.length}名を表示`}</button>`

    <div class="wl-ranking-ttl" onclick="S.wlRankExpand.postLow=!S.wlRankExpand.postLow;render()">
      📉 投稿率（低い順）<span class="wl-rank-toggle">${expanded ? '▲' : '▼'}</span>
    </div>
    <div class="wl-rank-list">${rows}</div>
    ${moreBtn}
  </div>`;
}

  if (!monthMembers) return '';
